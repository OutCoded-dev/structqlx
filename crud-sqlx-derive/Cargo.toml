[package]
name = "crud-sqlx-derive"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[features]
default = ["sqlite"]
sqlite = ["crud-sqlx/sqlite"]
postgres = ["crud-sqlx/postgres"]

[dependencies]
convert_case = "0.9.0"
crud-sqlx = {path = "../crud-sqlx"}
darling = "0.21.3"

proc-macro2 = "1.0.101"
quote = "1.0.41"
syn = "2.0.107"

[dev-dependencies]
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite"] }
time = "0.3.44"
uuid = { version = "1.18.1", features = ["v4"] }
