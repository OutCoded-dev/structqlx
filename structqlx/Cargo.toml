[package]
name = "structqlx"
description = "A crate for adding generating simple db models on top of SQLX."
author = "Graham Binns <graham@outcoded.dev>"
version = "0.2.0-alpha.1"
edition = "2024"
publish = true
license = "MIT"
repository = "https://gitlab.com/gmb/structqlx"

[[test]]
name = "test_sqlite"
requires_features = ["sqlite", "macros"]

[[test]]
name = "test_postgres"
requires_features = ["postgres", "macros", "sqlx/postgres"]

[features]
default = ["macros", "sqlite"]
macros = ["dep:structqlx-macros"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
sqlx = { version = "0.8.6", features = ["sqlite", "postgres"] }
structqlx-macros = { version = "0.2.0-alpha.1", path = "../structqlx-macros", optional = true}
strum = "0.27.2"
strum_macros = "0.27.2"

[dev-dependencies]
sqlx = { version = "0.8.6", features = ["sqlite", "postgres", "runtime-tokio"] }
