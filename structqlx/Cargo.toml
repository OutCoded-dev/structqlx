[package]
name = "structqlx"
description = "A crate for adding generating simple db models on top of SQLX."
author = "Graham Binns <graham@outcoded.dev>"
version = "0.2.0-alpha.2"
edition = "2024"
publish = true
license = "MIT"
repository = "https://github.com/OutCoded-dev/structqlx"

[[test]]
name = "test_sqlite"
requires_features = ["sqlite", "macros"]

[[test]]
name = "test_postgres"
requires_features = ["postgres", "macros", "sqlx/postgres"]

[[example]]
name = "example-model"
path = "examples/example_model.rs"
test = false

[features]
default = ["macros", "sqlite"]
macros = ["dep:structqlx-macros"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
futures = "0.3.32"
futures-core = "0.3.32"
sqlx = { version = "0.9.0", features = ["sqlite", "postgres"] }
structqlx-macros = { version = "0.2.0-alpha.1", path = "../structqlx-macros", optional = true}

[dev-dependencies]
dotenvy = "0.15.7"
sqlx = { version = "0.9.0", features = ["sqlite", "postgres", "runtime-tokio"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
