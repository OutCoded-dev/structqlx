[package]
name = "structqlx"
description = "A crate for adding generating simple db models on top of SQLX."
author = "Graham Binns <graham@outcoded.dev>"
version = "0.1.0"
edition = "2024"
publish = true
license = "MIT"
repository = "https://gitlab.com/gmb/structqlx"

[features]
default = ["macros", "sqlite"]
macros = ["dep:structqlx-macros"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
sqlx = "0.8.6"
structqlx-macros = { version = "0.1.0", path = "../structqlx-macros", optional = true}
