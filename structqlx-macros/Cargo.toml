[package]
name = "structqlx-macros"
description = "Macros to power structqlx."
author = "Graham Binns <graham@outcoded.dev>"
version = "0.2.0-alpha.1"
edition = "2024"
publish = true
license = "MIT"
repository = "https://gitlab.com/gmb/structqlx"

[lib]
proc-macro = true

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]

[dependencies]
convert_case = "0.9.0"
darling = "0.21.3"

proc-macro2 = "1.0.101"
quote = "1.0.41"
syn = "2.0.107"

[dev-dependencies]
rstest = "0.26.1"
sqlx = { version = "0.8.6", features = ["migrate", "runtime-tokio", "sqlite"] }
time = "0.3.44"
uuid = { version = "1.18.1", features = ["v4"] }
structqlx = {path = "../structqlx"}
