version: 2
updates:
  # Keeps the workflow action pins current so they don't rot again.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Weekly dependency checks
  - package-ecosystem: cargo
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
